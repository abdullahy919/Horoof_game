<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحروف مع عبد الله</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* الوضع النهاري الفاخر (الافتراضي) */
            --bg-main: radial-gradient(circle at 50% 25%, #ffffff 0%, #f1f5f9 55%, #cbd5e1 100%);
            --text-primary: #0f172a;
            --dock-bg: rgba(255, 255, 255, 0.92);
            --dock-border: rgba(203, 213, 225, 0.9);
            --stage-bg: linear-gradient(145deg, #1e293b, #0f172a);
            --stage-border: #e2e8f0;

            /* خلايا الحروف (الأبيض اللؤلؤي ثلاثي الأبعاد) */
            --hex-outer: linear-gradient(145deg, #cbd5e1, #94a3b8);
            --hex-inner: linear-gradient(165deg, #ffffff 0%, #f8fafc 60%, #e2e8f0 100%);
            --hex-text: #0f172a;

            /* خلايا الفريق الأحمر والجدار الأحمر */
            --red-outer: linear-gradient(145deg, #fecaca, #dc2626);
            --red-inner: linear-gradient(160deg, #ff5f6d 0%, #ef4444 45%, #991b1b 100%);
            --red-wall-inner: linear-gradient(160deg, #ef4444 0%, #b91c1c 60%, #7f1d1d 100%);

            /* خلايا الفريق الأخضر والجدار الأخضر */
            --green-outer: linear-gradient(145deg, #a7f3d0, #059669);
            --green-inner: linear-gradient(160deg, #34d399 0%, #10b981 45%, #065f46 100%);
            --green-wall-inner: linear-gradient(160deg, #10b981 0%, #047857 60%, #064e3b 100%);

            /* إضاءة الحرف المختار عشوائياً (الذهبي) */
            --gold-outer: linear-gradient(145deg, #fef08a, #f59e0b);
            --gold-inner: linear-gradient(160deg, #fde047 0%, #eab308 50%, #ca8a04 100%);
        }

        body.dark-mode {
            /* الوضع الليلي الفخم */
            --bg-main: radial-gradient(circle at 50% 25%, #1e293b 0%, #0f172a 65%, #020617 100%);
            --text-primary: #f8fafc;
            --dock-bg: rgba(30, 41, 59, 0.88);
            --dock-border: rgba(255, 255, 255, 0.12);
            --stage-bg: linear-gradient(145deg, #090d16, #020617);
            --stage-border: #334155;

            --hex-outer: linear-gradient(145deg, #64748b, #334155);
            --hex-inner: linear-gradient(165deg, #334155 0%, #1e293b 65%, #0f172a 100%);
            --hex-text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.4s ease;
        }

        /* الشريط العلوي الشامل والأنيق */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1220px;
            padding: 10px 24px;
            background: var(--dock-bg);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            border: 1px solid var(--dock-border);
            box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.12);
            gap: 12px;
            flex-wrap: wrap;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            font-size: 32px;
            filter: drop-shadow(0 4px 8px rgba(245, 158, 11, 0.4));
        }

        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #0284c7, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.dark-mode h1 {
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* أزرار التحكم بالأدوات */
        .tools-group {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .tool-btn {
            padding: 9px 18px;
            font-size: 15px;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 7px;
            color: #fff;
            position: relative;
        }

        .tool-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.28), transparent);
            border-radius: 14px 14px 0 0;
            pointer-events: none;
        }

        .tool-btn:hover {
            transform: translateY(-3px) scale(1.04);
        }

        .btn-random { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 6px 15px rgba(139, 92, 246, 0.35); }
        .btn-shuffle { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 6px 15px rgba(245, 158, 11, 0.35); }
        .btn-red { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 6px 15px rgba(239, 68, 68, 0.35); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.35); }
        .btn-clear { background: linear-gradient(135deg, #64748b, #334155); box-shadow: 0 6px 15px rgba(100, 116, 139, 0.35); }
        .btn-reset { background: linear-gradient(135deg, #334155, #0f172a); box-shadow: 0 6px 15px rgba(15, 23, 42, 0.35); }

        .tool-btn.active-tool {
            transform: translateY(-3px) scale(1.08);
            outline: 3px solid var(--text-primary);
            outline-offset: 3px;
        }

        .system-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .sys-btn {
            background: var(--dock-bg);
            color: var(--text-primary);
            border: 1px solid var(--dock-border);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .sys-btn:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
        }

        /* =========================================================
           مسرح خلية النحل المتكاملة (7×7 خلايا متعشقة مع الجدران!)
           ========================================================= */
        .stage-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 8px 0;
        }

        .honeycomb-stage {
            background: var(--stage-bg);
            padding: 28px 58px;
            border-radius: 42px;
            border: 6px solid var(--stage-border);
            box-shadow: 
                0 30px 70px -15px rgba(0, 0, 0, 0.45),
                inset 0 0 50px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .honeycomb-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hex-row {
            display: flex;
            gap: 6px;
            margin-top: -24px; /* تعشيق سداسي متلاصق تماماً */
        }

        .hex-row:first-child {
            margin-top: 0;
        }

        /* 
           توازن متماثل 100% في قلب الشاشة:
           عرض الخلية (94px) + الفراغ (6px) = 100px.
           الصفوف الفردية تتحرك يميناً (+25px) والزوجية يساراً (-25px).
           المسافة الإجمالية بينهما = 50px (نصف خلية بالضبط لتعشيق مثالي 100%!)
        */
        .hex-row.odd-row {
            transform: translateX(25px);
        }

        .hex-row.even-row {
            transform: translateX(-25px);
        }

        .hex-cell {
            width: 94px;
            height: 108px;
            position: relative;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
            z-index: 2;
        }

        .hex-cell.playable {
            cursor: pointer;
            z-index: 5;
        }

        .hex-outer {
            width: 100%;
            height: 100%;
            background: var(--hex-outer);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hex-inner {
            width: 100%;
            height: 100%;
            background: var(--hex-inner);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* اللمعة الكريستالية العلوية لكل خلية */
        .hex-inner::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 14%;
            right: 14%;
            height: 38%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
            clip-path: polygon(50% 0%, 100% 45%, 82% 100%, 18% 100%, 0% 45%);
            pointer-events: none;
        }

        body.dark-mode .playable .hex-inner::before {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
        }

        /* خلايا الجدران الثابتة (المحيطة باللعبة مثل خلية النحل) */
        .hex-cell.wall-red .hex-outer { background: var(--red-outer); }
        .hex-cell.wall-red .hex-inner { background: var(--red-wall-inner); }

        .hex-cell.wall-green .hex-outer { background: var(--green-outer); }
        .hex-cell.wall-green .hex-inner { background: var(--green-wall-inner); }

        /* خلايا الزوايا الأربع (مقسومة هندسياً بين الأخضر والأحمر!) */
        .hex-cell.wall-corner-tr .hex-outer,
        .hex-cell.wall-corner-bl .hex-outer { background: linear-gradient(135deg, #10b981, #ef4444); }
        .hex-cell.wall-corner-tr .hex-inner { background: linear-gradient(135deg, #059669 48%, #b91c1c 52%); }
        .hex-cell.wall-corner-bl .hex-inner { background: linear-gradient(135deg, #b91c1c 48%, #059669 52%); }

        .hex-cell.wall-corner-tl .hex-outer,
        .hex-cell.wall-corner-br .hex-outer { background: linear-gradient(45deg, #10b981, #ef4444); }
        .hex-cell.wall-corner-tl .hex-inner { background: linear-gradient(225deg, #059669 48%, #b91c1c 52%); }
        .hex-cell.wall-corner-br .hex-inner { background: linear-gradient(225deg, #b91c1c 48%, #059669 52%); }

        /* الحرف العملاق داخل الخلية */
        .hex-letter {
            font-family: 'Tajawal', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: var(--hex-text);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
            z-index: 2;
            line-height: 1;
        }

        /* تفاعل خلايا اللعب عند تمرير الماوس */
        .hex-cell.playable:hover {
            transform: scale(1.15) translateY(-4px);
            z-index: 30;
            filter: drop-shadow(0 15px 22px rgba(56, 189, 248, 0.55));
        }

        .hex-cell.playable:hover .hex-outer {
            background: linear-gradient(145deg, #38bdf8, #2563eb);
        }

        /* حالة تلوين الفريق الأحمر */
        .hex-cell.team-red {
            filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.75));
            z-index: 15;
        }
        .hex-cell.team-red .hex-outer { background: var(--red-outer); }
        .hex-cell.team-red .hex-inner { background: var(--red-inner); }
        .hex-cell.team-red .hex-letter {
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(127, 29, 29, 0.9);
            transform: scale(1.08);
        }

        /* حالة تلوين الفريق الأخضر */
        .hex-cell.team-green {
            filter: drop-shadow(0 0 18px rgba(16, 185, 129, 0.75));
            z-index: 15;
        }
        .hex-cell.team-green .hex-outer { background: var(--green-outer); }
        .hex-cell.team-green .hex-inner { background: var(--green-inner); }
        .hex-cell.team-green .hex-letter {
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(6, 78, 59, 0.9);
            transform: scale(1.08);
        }

        /* إضاءة الروليت الذهبي للحرف العشوائي */
        .hex-cell.spotlight {
            transform: scale(1.18);
            z-index: 40;
            filter: drop-shadow(0 0 28px rgba(250, 204, 21, 0.95));
        }
        .hex-cell.spotlight .hex-outer { background: var(--gold-outer); }
        .hex-cell.spotlight .hex-inner { background: var(--gold-inner); }
        .hex-cell.spotlight .hex-letter {
            color: #0f172a;
            transform: scale(1.12);
        }

        @keyframes popHex {
            0% { transform: scale(0.7) rotateY(90deg); }
            65% { transform: scale(1.18) rotateY(-8deg); }
            100% { transform: scale(1) rotateY(0deg); }
        }
        .animate-pop {
            animation: popHex 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* شريط الحالة السفلي */
        .status-bar {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            background: var(--dock-bg);
            backdrop-filter: blur(12px);
            padding: 10px 32px;
            border-radius: 30px;
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.12);
            border: 1px solid var(--dock-border);
        }

        /* التجاوب مع الشاشات المتوسطة والجوال */
        @media (max-width: 900px) {
            .top-bar { justify-content: center; text-align: center; }
            .honeycomb-stage { padding: 22px 42px; }
            .hex-cell { width: 72px; height: 83px; }
            .hex-row { gap: 5px; margin-top: -18.5px; }
            .hex-row.odd-row { transform: translateX(19.25px); }
            .hex-row.even-row { transform: translateX(-19.25px); }
            .hex-letter { font-size: 28px; }
        }

        @media (max-width: 580px) {
            .honeycomb-stage { padding: 16px 26px; border-radius: 28px; }
            .hex-cell { width: 46px; height: 53px; }
            .hex-row { gap: 3px; margin-top: -12px; }
            .hex-row.odd-row { transform: translateX(12.25px); }
            .hex-row.even-row { transform: translateX(-12.25px); }
            .hex-letter { font-size: 19px; }
            .tool-btn { padding: 8px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي المتكامل (بدون المؤقت كما طلبت) -->
    <div class="top-bar">
        <div class="brand">
            <span class="brand-icon">🐝</span>
            <h1>لعبة الحروف مع عبد الله</h1>
        </div>

        <div class="tools-group">
            <button class="tool-btn btn-shuffle" onclick="shuffleLetters()">🔀 خلط الحروف</button>
            <button class="tool-btn btn-random" onclick="pickRandomLetter()">🎲 حرف عشوائي</button>
            <button class="tool-btn btn-red" id="tool-red" onclick="selectTool('red')">🟥 أحمر</button>
            <button class="tool-btn btn-green" id="tool-green" onclick="selectTool('green')">🟩 أخضر</button>
            <button class="tool-btn btn-clear" id="tool-clear" onclick="selectTool('clear')">🧹 مسح حرف</button>
            <button class="tool-btn btn-reset" onclick="resetAll()">🔄 مسح الكل</button>
        </div>

        <div class="system-group">
            <button class="sys-btn" onclick="toggleFullScreen()" title="ملء الشاشة للبروجكتر">📺 عرض كامل</button>
            <button class="sys-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
            <button class="sys-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <!-- مسرح خلية النحل المتعشقة (7×7 تشمل الجدران السداسية والحروف) -->
    <div class="stage-wrapper">
        <div class="honeycomb-stage">
            <div class="honeycomb-grid" id="gameBoard"></div>
        </div>
    </div>

    <!-- شريط الحالة السفلي -->
    <div class="status-bar" id="gameStatus">
        ✨ جاهز للتحدي! اختر اللون أو اضغط (🎲 حرف عشوائي) لاختيار سؤال
    </div>

    <script>
        const allArabicLetters = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];
        let boardState = [];
        let currentTool = 'red';
        let soundEnabled = true;
        let lastClickedIndex = null;
        let spotlightIndex = null;
        let isRolling = false;

        // محرك الصوتيات التفاعلي المدمج
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playTone(freq, type = 'sine', duration = 0.14) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function initBoard() {
            // نأخذ أول 25 حرف في البداية
            boardState = allArabicLetters.slice(0, 25).map(letter => ({ letter: letter, team: null }));
            selectTool('red');
            renderBoard();
        }

        function shuffleLetters() {
            if (isRolling) return;
            playTone(300, 'triangle', 0.12);
            setTimeout(() => playTone(450, 'triangle', 0.14), 70);
            setTimeout(() => playTone(600, 'triangle', 0.16), 140);

            // خلط من بين جميع الـ 28 حرف عربي لاختيار 25 حرف متجدد في كل جولة!
            const shuffledPool = [...allArabicLetters].sort(() => Math.random() - 0.5).slice(0, 25);
            boardState.forEach((cell, idx) => {
                cell.letter = shuffledPool[idx];
            });

            lastClickedIndex = null;
            spotlightIndex = null;
            renderBoard();
            document.getElementById('gameStatus').innerText = "🔀 تم خلط الحروف وتوزيع الخلية عشوائياً!";
        }

        // ميزة الروليت لاختيار حرف عشوائي غير ملون ببريق ذهبي وصوت حماسي
        function pickRandomLetter() {
            if (isRolling) return;
            const availableIndices = boardState
                .map((c, idx) => c.team === null ? idx : null)
                .filter(idx => idx !== null);

            if (availableIndices.length === 0) {
                alert("🎉 جميع الحروف ملونة بالفعل!");
                return;
            }

            isRolling = true;
            let steps = 0;
            const totalSteps = 14;
            document.getElementById('gameStatus').innerText = "🎲 جاري اختيار حرف عشوائي...";

            const rollInterval = setInterval(() => {
                const randIdx = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                spotlightIndex = randIdx;
                playTone(350 + (steps * 25), 'sine', 0.06);
                renderBoard();
                steps++;

                if (steps >= totalSteps) {
                    clearInterval(rollInterval);
                    isRolling = false;
                    const chosenLetter = boardState[spotlightIndex].letter;
                    playTone(780, 'triangle', 0.28);
                    document.getElementById('gameStatus').innerText = `🌟 الحرف المختار للسؤال هو: [ ${chosenLetter} ] !`;
                }
            }, 75);
        }

        function selectTool(tool) {
            currentTool = tool;
            playTone(420, 'sine', 0.08);
            
            document.getElementById('tool-red').classList.remove('active-tool');
            document.getElementById('tool-green').classList.remove('active-tool');
            document.getElementById('tool-clear').classList.remove('active-tool');

            if (tool === 'red') {
                document.getElementById('tool-red').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🟥 أداة التلوين الأحمر نشطة — اضغط على أي حرف";
            } else if (tool === 'green') {
                document.getElementById('tool-green').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🟩 أداة التلوين الأخضر نشطة — اضغط على أي حرف";
            } else if (tool === 'clear') {
                document.getElementById('tool-clear').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🧹 الممحاة نشطة — اضغط على أي حرف لمسح لونه";
            }
        }

        // بناء مصفوفة 7×7 (الجدران السداسية المتعشقة + الـ 25 حرف في القلب)
        function renderBoard() {
            const boardEl = document.getElementById('gameBoard');
            boardEl.innerHTML = '';

            for (let r = 0; r < 7; r++) {
                const rowEl = document.createElement('div');
                rowEl.classList.add('hex-row');
                rowEl.classList.add(r % 2 === 0 ? 'odd-row' : 'even-row');

                for (let c = 0; c < 7; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.classList.add('hex-cell');

                    // تحديد هل الخلية جدار أم حرف لعب
                    const isTop = (r === 0);
                    const isBottom = (r === 6);
                    const isRight = (c === 0); // لأن الاتجاه RTL فالعمود 0 هو اليمين
                    const isLeft = (c === 6);

                    if (isTop && isRight) {
                        cellEl.classList.add('wall-corner-tr');
                        cellEl.innerHTML = `<div class="hex-outer"><div class="hex-inner"></div></div>`;
                    } else if (isTop && isLeft) {
                        cellEl.classList.add('wall-corner-tl');
                        cellEl.innerHTML = `<div class="hex-outer"><div class="hex-inner"></div></div>`;
                    } else if (isBottom && isRight) {
                        cellEl.classList.add('wall-corner-br');
                        cellEl.innerHTML = `<div class="hex-outer"><div class="hex-inner"></div></div>`;
                    } else if (isBottom && isLeft) {
                        cellEl.classList.add('wall-corner-bl');
                        cellEl.innerHTML = `<div class="hex-outer"><div class="hex-inner"></div></div>`;
                    } else if (isTop || isBottom) {
                        // الجدران العلوية والسفلية خضراء (المسار الرأسي)
                        cellEl.classList.add('wall-green');
                        cellEl.innerHTML = `<div class="hex-outer"><div class="hex-inner"></div></div>`;
                    } else if (isRight || isLeft) {
                        // الجدران اليمنى واليسرى حمراء (المسار الأفقي)
                        cellEl.classList.add('wall-red');
                        cellEl.innerHTML = `<div class="hex-outer"><div class="hex-inner"></div></div>`;
                    } else {
                        // خلية لعب حقيقية (من 1 إلى 5)
                        const playRow = r - 1;
                        const playCol = c - 1;
                        const index = playRow * 5 + playCol;
                        const cellData = boardState[index];

                        cellEl.classList.add('playable');
                        if (cellData.team === 'red') cellEl.classList.add('team-red');
                        if (cellData.team === 'green') cellEl.classList.add('team-green');
                        if (index === spotlightIndex && cellData.team === null) cellEl.classList.add('spotlight');
                        if (index === lastClickedIndex) cellEl.classList.add('animate-pop');

                        cellEl.innerHTML = `
                            <div class="hex-outer">
                                <div class="hex-inner">
                                    <span class="hex-letter">${cellData.letter}</span>
                                </div>
                            </div>
                        `;

                        cellEl.onclick = () => handleCellClick(index);
                    }

                    rowEl.appendChild(cellEl);
                }

                boardEl.appendChild(rowEl);
            }
        }

        function handleCellClick(index) {
            if (isRolling) return;
            lastClickedIndex = index;
            if (spotlightIndex === index) spotlightIndex = null;
            const letter = boardState[index].letter;

            if (currentTool === 'red') {
                boardState[index].team = 'red';
                playTone(540, 'sine', 0.16);
                setTimeout(() => playTone(720, 'sine', 0.18), 60);
                document.getElementById('gameStatus').innerText = `🟥 الفريق الأحمر يحتل خلية الحرف [ ${letter} ]!`;
            } else if (currentTool === 'green') {
                boardState[index].team = 'green';
                playTone(580, 'sine', 0.16);
                setTimeout(() => playTone(820, 'sine', 0.18), 60);
                document.getElementById('gameStatus').innerText = `🟩 الفريق الأخضر يحتل خلية الحرف [ ${letter} ]!`;
            } else if (currentTool === 'clear') {
                boardState[index].team = null;
                playTone(250, 'sine', 0.14);
                document.getElementById('gameStatus').innerText = `🧹 تم تفريغ خلية الحرف [ ${letter} ]`;
            }

            renderBoard();
        }

        function resetAll() {
            if (confirm("⚠️ هل أنت متأكد من مسح جميع الحروف الملونة وبدء جولة جديدة؟")) {
                playTone(200, 'sawtooth', 0.22);
                boardState.forEach(cell => cell.team = null);
                lastClickedIndex = null;
                spotlightIndex = null;
                renderBoard();
                document.getElementById('gameStatus').innerText = "🔄 تم تصفير اللوحة بالكامل.. جولة جديدة!";
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtn').innerText = isDark ? "☀️" : "🌙";
            playTone(440, 'sine', 0.1);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? "🔊" : "🔇";
        }

        initBoard();
    </script>
</body>
</html>
