<style>
:root{--w:min(150px,calc((100vw - 50px)/8.1),calc((100dvh - 240px)/6.7));--g:calc(var(--w)*.064);
--hx:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
--bg:radial-gradient(ellipse at 50% -10%,#22346b 0,#0b1226 55%,#040612 100%);--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);--tx:#f1f5f9;--mut:#94a3b8;--tool:#94a3b8;--menu:#1b1646}
body.light{--menu:#fff;--bg:radial-gradient(ellipse at 50% -10%,#fff 0,#e6edf8 55%,#c3cfe0 100%);--panel:rgba(255,255,255,.85);--line:rgba(100,116,139,.35);--tx:#0f172a;--mut:#475569}
body[data-tool=red]{--tool:#ef4444}body[data-tool=green]{--tool:#10b981}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);display:grid;grid-template-rows:auto 1fr auto auto;gap:10px;padding:10px 16px 14px;overflow-x:hidden;transition:background .4s}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.22;z-index:-1;animation:drift 14s ease-in-out infinite alternate}
body::before{background:#ef4444;right:-18vmax;top:10vh}body::after{background:#10b981;left:-18vmax;bottom:-10vh;animation-delay:-7s}
@keyframes drift{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 18px;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px)}
h1{margin:0;font:700 clamp(22px,3vw,34px) 'Reem Kufi';background:linear-gradient(90deg,#fbbf24,#f472b6,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
h1 i{font-style:normal;-webkit-text-fill-color:initial;margin-inline-end:8px}
.grp{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:13px;padding:8px 14px;font-size:14px;font-weight:800;color:#fff;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;position:relative;box-shadow:0 5px 14px rgba(0,0,0,.3)}
.btn:hover{transform:translateY(-3px) scale(1.05)}
.btn.on{outline:3px solid var(--tx);outline-offset:2px;transform:translateY(-3px) scale(1.07)}
.b-spin{background:linear-gradient(135deg,#a855f7,#6d28d9)}.b-sh{background:linear-gradient(135deg,#f59e0b,#b45309)}.b-red{background:linear-gradient(135deg,#ef4444,#991b1b)}.b-green{background:linear-gradient(135deg,#10b981,#065f46)}.b-gray{background:linear-gradient(135deg,#64748b,#334155)}
.sys{background:var(--panel);color:var(--tx);border:1px solid var(--line);box-shadow:none;font-family:inherit}
.main{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;justify-items:center}
.card{width:min(240px,100%);padding:18px 14px;border-radius:26px;background:var(--panel);border:2px solid var(--line);backdrop-filter:blur(12px);text-align:center;position:relative;overflow:hidden;transition:.3s}
.card::before,.card::after{content:"";position:absolute;background:var(--c);box-shadow:0 0 16px var(--c)}
.card.g::before{inset:0 0 auto;height:9px}.card.g::after{inset:auto 0 0;height:9px}
.card.r::before{inset:0 0 0 auto;width:9px}.card.r::after{inset:0 auto 0 0;width:9px}
.card.act{border-color:var(--c);box-shadow:0 0 36px -4px var(--c)}
.nm{font-size:22px;font-weight:900;outline:0;border-radius:8px;padding:2px 6px;display:inline-block;min-width:80px}
.nm:focus{background:rgba(255,255,255,.12);user-select:text}
.sc{font:700 clamp(54px,8vh,92px)/1.05 'Reem Kufi';color:var(--c);text-shadow:0 0 30px var(--c)}
.hint{font-size:15px;color:var(--mut);font-weight:800}.hint em{font-style:normal;color:var(--c);font-size:1.4em;font-family:'Reem Kufi';margin-inline-start:4px}
.stage{padding:calc(var(--w)*.3) calc(var(--w)*.55);border-radius:38px;background:radial-gradient(ellipse at 50% 40%,#2a1d6e 0,#17104a 55%,#0b0830 100%);border:2px solid rgba(167,139,250,.45);box-shadow:0 30px 80px -20px #05031a,inset 0 0 70px rgba(5,3,30,.85),0 0 70px rgba(139,92,246,.28)}
.row{display:flex;gap:var(--g);margin-top:calc(var(--w)*-.255)}.row:first-child{margin-top:0}
.row.o{transform:translateX(calc(var(--w)*.266))}.row.e{transform:translateX(calc(var(--w)*-.266))}
.hex{--rim:linear-gradient(145deg,#e2e8f0,#64748b);--face:linear-gradient(165deg,#fff,#f1f5f9 60%,#cbd5e1);--ink:#0f172a;width:var(--w);height:calc(var(--w)*1.1547);position:relative;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));transition:transform .22s cubic-bezier(.34,1.56,.64,1),filter .25s,opacity .4s}
.rim{width:100%;height:100%;clip-path:var(--hx);padding:calc(var(--w)*.04);background:var(--rim);animation:in .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--d)}
.face{width:100%;height:100%;clip-path:var(--hx);background:var(--face);display:grid;place-items:center;position:relative}
.face::before{content:"";position:absolute;top:4%;left:14%;right:14%;height:38%;background:linear-gradient(rgba(255,255,255,.6),transparent);clip-path:polygon(50% 0,100% 45%,82% 100%,18% 100%,0 45%);pointer-events:none}
@keyframes in{from{transform:scale(0) rotate(-40deg);opacity:0}}
.wr{--rim:linear-gradient(145deg,#fecaca,#dc2626);--face:linear-gradient(160deg,#ef4444,#7f1d1d)}
.wg{--rim:linear-gradient(145deg,#a7f3d0,#059669);--face:linear-gradient(160deg,#10b981,#064e3b)}
.wc{--rim:linear-gradient(135deg,#10b981,#ef4444);--face:linear-gradient(var(--a),#059669 48%,#b91c1c 52%)}
.wr .face,.wg .face{animation:sh 3s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes sh{to{filter:brightness(1.3)}}
b{font:900 calc(var(--w)*.42)/1 'Cairo';color:var(--ink);z-index:2;transition:transform .2s}
.p{cursor:pointer;z-index:2}
.p:not(.t-red):not(.t-green):not(.spot):hover{transform:scale(1.12) translateY(-3px);z-index:9;--rim:linear-gradient(145deg,var(--tool),#fff);filter:drop-shadow(0 0 16px var(--tool))}
.t-red{--rim:linear-gradient(145deg,#fecaca,#dc2626);--face:linear-gradient(160deg,#ff6b78,#ef4444 45%,#991b1b);--ink:#fff;filter:drop-shadow(0 0 18px rgba(239,68,68,.85));z-index:5}
.t-green{--rim:linear-gradient(145deg,#a7f3d0,#059669);--face:linear-gradient(160deg,#34d399,#10b981 45%,#065f46);--ink:#fff;filter:drop-shadow(0 0 18px rgba(16,185,129,.85));z-index:5}
.t-red b,.t-green b{text-shadow:0 3px 8px rgba(0,0,0,.6);transform:scale(1.08)}
.spot{--rim:linear-gradient(145deg,#fef08a,#f59e0b);--face:linear-gradient(160deg,#fde047,#eab308 50%,#ca8a04);--ink:#1c1400;transform:scale(1.17);z-index:30;filter:drop-shadow(0 0 28px rgba(250,204,21,.95))}
.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.6) rotateY(90deg)}100%{transform:none}}
.over .p:not(.win){opacity:.35}
.win{z-index:40!important;animation:wp .8s ease-in-out infinite alternate;animation-delay:calc(var(--i)*.1s)}
@keyframes wp{from{transform:scale(1);filter:drop-shadow(0 0 10px #fff)}to{transform:scale(1.15);filter:drop-shadow(0 0 32px #fde047)}}
.status{display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(15px,2vw,20px);font-weight:800;padding:8px 26px 8px 12px;border-radius:60px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);justify-self:center}
.orb{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:700 38px 'Reem Kufi';color:#1c1400;background:radial-gradient(circle at 35% 30%,#fff7c2,#fbbf24 55%,#b45309);box-shadow:0 0 26px rgba(251,191,36,.55);flex:none}
.orb.on{animation:og .35s infinite alternate}@keyframes og{to{box-shadow:0 0 50px #fde047;transform:scale(1.12)}}
#rev{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font:700 min(46vh,400px)/1 'Reem Kufi';color:#fde047;text-shadow:0 0 70px #f59e0b,0 10px 0 #92400e;opacity:0;z-index:80}
#rev.go{animation:rev 2.2s ease-out}
@keyframes rev{0%{opacity:0;transform:scale(.2) rotate(-14deg)}15%{opacity:1;transform:scale(1.12)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
#win{position:fixed;inset:0;display:none;place-items:center;background:rgba(3,6,20,.72);backdrop-filter:blur(6px);z-index:90}#win.show{display:grid;animation:fade .5s}
@keyframes fade{from{opacity:0}}
.wb{text-align:center;padding:34px 54px;border-radius:34px;background:linear-gradient(160deg,#1e293b,#0b1226);border:3px solid var(--c);box-shadow:0 0 90px -10px var(--c);color:#f1f5f9;max-width:92vw}
.tr{font-size:clamp(70px,14vh,120px);animation:bn 1s ease-in-out infinite alternate}@keyframes bn{to{transform:translateY(-14px) rotate(6deg)}}
.wb h2{margin:6px 0;font:700 clamp(30px,6vw,58px)/1.2 'Reem Kufi';color:var(--c);text-shadow:0 0 30px var(--c)}
.wb p{margin:0 0 20px;font-size:clamp(16px,2.4vw,22px);font-weight:700;color:#cbd5e1}
#ask{position:fixed;inset:0;display:none;place-items:center;background:rgba(3,6,20,.65);backdrop-filter:blur(5px);z-index:95}#ask.show{display:grid;animation:fade .25s}
.ab{text-align:center;padding:28px 40px;border-radius:26px;background:linear-gradient(160deg,#241a5e,#0d0a2e);border:2px solid rgba(167,139,250,.5);box-shadow:0 20px 60px #000;color:#f1f5f9;max-width:90vw}
.aq{font-size:clamp(18px,2.6vw,26px);font-weight:800;margin-bottom:20px}.ab .btn{font-size:17px;padding:10px 28px}
#lm{position:absolute;top:calc(100% + 8px);inset-inline-end:0;display:none;flex-direction:column;gap:4px;padding:8px;min-width:150px;border-radius:16px;background:var(--menu);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:70}#lm.show{display:flex}
#lm button{border:0;border-radius:10px;padding:8px 12px;background:transparent;color:var(--tx);font-size:15px;font-weight:800;cursor:pointer;text-align:start}
#lm button:hover{background:rgba(139,92,246,.25)}#lm button.on{background:linear-gradient(135deg,#a855f7,#6d28d9);color:#fff}
.top{position:relative;z-index:60}#lg{padding:8px 11px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.top>h1{justify-self:start}.top>.grp{flex-wrap:nowrap}.top>.grp:last-child{justify-self:end}
h1 span{font:inherit}
html:not([lang=ar]) .top .btn{font-size:13px;padding:8px 10px}
@media(max-width:1250px){.top{display:flex;flex-wrap:wrap;justify-content:center}.top>.grp{flex-wrap:wrap;justify-content:center}}.stage{direction:rtl}
.foot{text-align:center;font-size:13px;font-weight:600;color:var(--mut)}.foot a{color:var(--tx);font-weight:800;user-select:text;text-decoration:none}.foot a:hover{text-decoration:underline}
#bn{--c:#fbbf24;position:fixed;top:12px;left:50%;transform:translate(-50%,-180%);transition:transform .45s cubic-bezier(.34,1.56,.64,1);z-index:85;display:flex;align-items:center;gap:20px;padding:14px 26px;border-radius:30px;background:linear-gradient(160deg,#241a5e,#0d0a2e);border:4px solid var(--c);box-shadow:0 0 70px -6px var(--c),0 20px 50px #000;color:#f1f5f9}
#bn.show{transform:translate(-50%,0)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:700 44px 'Reem Kufi';background:conic-gradient(var(--c) var(--p,100%),rgba(255,255,255,.18) 0);position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#120d3a}.ring span{position:relative}
#bw{font:700 clamp(26px,3.4vw,44px)/1.2 'Reem Kufi'}#bs{font-size:16px;font-weight:800;color:#cbd5e1}
.pl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;max-height:190px;overflow:hidden}
.pl span{background:rgba(255,255,255,.1);border:1px solid var(--c);border-radius:20px;padding:2px 10px;font-size:14px;font-weight:800}
#jn{position:fixed;inset:0;display:none;place-items:center;background:rgba(3,6,20,.7);backdrop-filter:blur(6px);z-index:95}#jn.show{display:grid;animation:fade .3s}
#qr{background:#fff;padding:12px;border-radius:16px;display:inline-block;margin:8px 0}
#rc{font:700 56px/1 'Reem Kufi';letter-spacing:10px;color:#fde047;margin:6px 0}
#ru{direction:ltr;font-size:13px;color:#94a3b8;word-break:break-all;max-width:300px;margin:0 auto 14px;user-select:text}
#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
@media(max-width:900px){.main{grid-template-columns:1fr 1fr;gap:12px}.stage{grid-column:1/-1;order:3}.card{padding:10px}.sc{font-size:44px}.top{justify-content:center}}

</style>

let cells=[],els=[],tool='red',snd=true,spot=null,rolling=false,over=false,win=[],hist=[],sc={red:0,green:0},timers=[];

/* ===== الصوت ===== */
let AC;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,t='sine',d=.15,v=.15,at=0){if(!snd)return;try{const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d)}catch(e){}}
function clap(sec){if(!snd)return;try{const c=ac(),n=c.sampleRate*.08,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
for(let k=0;k<sec*24;k++){const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),at=Math.random()*sec;s.buffer=b;f.type='bandpass';f.frequency.value=1200+Math.random()*2500;g.gain.value=.3*Math.min(1,(sec-at)/1.5+.15);s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+at)}}catch(e){}}
const fanfare=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,'triangle',.4,.16,i*.13));

/* ===== المؤثرات (ألعاب نارية + قصاصات) ===== */
const cv=$('fx'),cx=cv.getContext('2d');let P=[];
const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener('resize',rs);
function burst(x,y,cols,n=60,sp=7){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp+1;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:cols[Math.random()*cols.length|0],s:2+Math.random()*3,g:.12,dc:.012+Math.random()*.012})}}
function confetti(cols){for(let i=0;i<150;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*400,vx:Math.random()*4-2,vy:2+Math.random()*4,l:1,c:cols[i%cols.length],s:7+Math.random()*7,g:0,dc:.0025,r:1,rot:Math.random()*6})}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0&&p.y<cv.height+40);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=p.dc;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;
if(p.r){p.rot+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}else{cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill()}}requestAnimationFrame(loop)})();
const center=i=>{const r=els[i].getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};

/* ===== بناء اللوحة ===== */
function build(){const B=$('board');for(let r=0;r<7;r++){const row=document.createElement('div');row.className='row '+(r%2?'e':'o');
for(let c=0;c<7;c++){const h=document.createElement('div'),top=r==0||r==6,side=c==0||c==6;h.className='hex';h.innerHTML='<div class="rim"><div class="face"></div></div>';
h.firstChild.style.setProperty('--d',(r*7+c)*28+'ms');h.style.setProperty('--d',(r*7+c)*60+'ms');
if(top&&side){h.classList.add('wc');h.style.setProperty('--a',[135,225,45,315][(r?2:0)+(c?1:0)]+'deg')}
else if(top)h.classList.add('wg');else if(side)h.classList.add('wr');
else{const i=(r-1)*5+c-1;h.classList.add('p');h.firstChild.firstChild.innerHTML='<b></b>';h.onclick=()=>clickCell(i);els[i]=h}
row.appendChild(h)}B.appendChild(row)}}
function deal(){const a=[...LANG[lg].a].sort(()=>Math.random()-.5).slice(0,25);a.forEach((l,i)=>cells[i]?cells[i].l=l:cells[i]={l,t:null})}
function paint(){els.forEach((h,i)=>{const s=cells[i],w=win.indexOf(i);h.className='hex p'+(s.t?' t-'+s.t:'')+(i===spot&&!s.t?' spot':'')+(w>=0?' win':'');h.style.setProperty('--i',w);h.querySelector('b').textContent=s.l});
document.body.classList.toggle('over',over);['red','green'].forEach(t=>$('c-'+t).textContent=cells.filter(c=>c.t==t).length)}

/* ===== الأدوات ===== */
function setTool(t){tool=t;document.body.dataset.tool=t;['red','green','clear'].forEach(k=>$('t-'+k).classList.toggle('on',k==t));
$('card-red').classList.toggle('act',t=='red');$('card-green').classList.toggle('act',t=='green');tone(420,'sine',.08);
msg(T(t=='red'?'tred':t=='green'?'tgrn':'tclr'))}
function shuffle(){if(rolling||over)return;[300,450,600].forEach((f,i)=>tone(f,'triangle',.14,.12,i*.07));deal();spot=null;paint();msg(T('shf'))}
function ask(q,fn){const m=$('ask');$('aq').textContent=T(q);m.classList.add('show');const x=()=>m.classList.remove('show');$('ay').onclick=()=>{x();fn()};$('an').onclick=x;m.onclick=e=>{if(e.target===m)x()}}
function clearAll(){cells.forEach(c=>c.t=null);over=false;win=[];spot=null;hist=[];$('win').classList.remove('show');paint();tone(200,'sawtooth',.25);msg(T('ready'))}
function resetScores(){sc={red:0,green:0};save();score();msg(T('ready'))}
function undo(){if(rolling||!hist.length)return;const h=hist.pop();cells.forEach((c,i)=>c.t=h[i]);over=false;win=[];$('win').classList.remove('show');paint();tone(330,'sine',.1);msg(T('ready'))}
function newRound(){over=false;win=[];hist=[];spot=null;cells.forEach(c=>c.t=null);deal();$('win').classList.remove('show');timers.forEach(clearInterval);paint();$('orb').textContent=LANG[lg].d=='rtl'?'؟':'?';tone(500,'triangle',.2);msg(T('ready'))}
const score=()=>{$('s-red').textContent=sc.red;$('s-green').textContent=sc.green};
function toggleFull(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}

/* ===== التلوين وفحص الفوز (هيكس) ===== */
function clickCell(i){if(rolling||over)return;hist.push(cells.map(c=>c.t));const s=cells[i];s.t=tool=='clear'?null:tool;if(i===spot)spot=null;paint();
const h=els[i];h.classList.add('pop');
if(!s.t){tone(250,'sine',.14);msg(T('emp',{l:s.l}));return}
tone(s.t=='red'?540:580,'sine',.16);tone(s.t=='red'?720:820,'sine',.18,.15,.06);
const[x,y]=center(i);burst(x,y,s.t=='red'?['#ef4444','#fca5a5','#fff']:['#10b981','#6ee7b7','#fff'],22,4);
msg((s.t=='red'?'🟥 ':'🟩 ')+T('occ',{n:$('n-'+s.t).textContent,l:s.l}));
const p=check(s.t);if(p)victory(s.t,p)}
function nb(i){const r=Math.floor(i/5),c=i%5,d=(r+1)%2?1:-1;return[[r,c-1],[r,c+1],[r-1,c],[r-1,c+d],[r+1,c],[r+1,c+d]].filter(([a,b])=>a>=0&&a<5&&b>=0&&b<5).map(([a,b])=>a*5+b)}
function check(t){const st=t=='red'?i=>i%5==0:i=>i<5,go=t=='red'?i=>i%5==4:i=>i>=20,par={},q=[];
cells.forEach((s,i)=>{if(s.t==t&&st(i)){par[i]=-1;q.push(i)}});
while(q.length){const i=q.shift();if(go(i)){const p=[];for(let k=i;k!=-1;k=par[k])p.push(k);return p.reverse()}
nb(i).forEach(j=>{if(cells[j].t==t&&!(j in par)){par[j]=i;q.push(j)}})}return null}

/* ===== الفوز والاحتفال ===== */
function victory(t,p){if(R)R.child('state').set({open:false,winner:null});over=true;win=p;sc[t]++;save();score();paint();
const cols=t=='red'?['#ef4444','#fca5a5','#fbbf24','#fff']:['#10b981','#6ee7b7','#fbbf24','#fff'];
fanfare();clap(6);confetti(cols);setTimeout(()=>confetti(cols),1800);
let n=0;const fw=setInterval(()=>{burst(Math.random()*innerWidth,Math.random()*innerHeight*.6,cols,70,8);tone(120+Math.random()*180,'sawtooth',.25,.07);if(++n>22)clearInterval(fw)},380);timers.push(fw);
msg(T('vic',{n:$('n-'+t).textContent}));
setTimeout(()=>{$('wb').style.setProperty('--c',t=='red'?'#ef4444':'#10b981');$('wt').textContent=T('win',{n:$('n-'+t).textContent});$('win').classList.add('show')},1500)}

/* ===== الحرف العشوائي: دوران مشوّق ===== */
function spin(){if(rolling||over)return;const av=cells.map((s,i)=>s.t?-1:i).filter(i=>i>=0);if(!av.length){msg(T('full'));return}
if(R)R.child('state').set({open:false,winner:null});rolling=true;spot=null;paint();$('orb').classList.add('on');
const D=SPIN_MS,t0=performance.now();let prev=-1;msg(T('roll'));
const step=()=>{const e=performance.now()-t0,p=Math.min(e/D,1);let j;do{j=av[Math.random()*av.length|0]}while(j===prev&&av.length>1);prev=j;spot=j;paint();$('orb').textContent=cells[j].l;tone(260+p*560,'triangle',.07,.12);
if(e>=D)return done(j);setTimeout(step,45+Math.pow(p,3)*430)};step()}
function done(j){rolling=false;$('orb').classList.remove('on');const l=cells[j].l;
fanfare();const r=$('rev');r.textContent=l;r.classList.remove('go');void r.offsetWidth;r.classList.add('go');
const[x,y]=center(j);burst(x,y,['#fde047','#f59e0b','#fff'],90,9);setTimeout(()=>burst(x,y,['#fde047','#fff'],60,6),250);
msg(T('q',{l}));openBuzz()}

addEventListener('keydown',e=>{if($('ask').classList.contains('show')){if(e.key=='Escape')$('an').click();return}if(e.target.isContentEditable||e.target.tagName=='SELECT')return;const k=e.key.toLowerCase();
if(e.code=='Space'){e.preventDefault();spin()}else if(k=='r')setTool('red');else if(k=='g')setTool('green');else if(k=='e')setTool('clear');else if(k=='z')undo();else if(k=='s')shuffle();else if(k=='f')toggleFull()});
