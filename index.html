<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحروف مع عبد الله</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* الثيمات (ليلي ونهاري) */
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --arena-bg: #1e293b;
            --cell-bg: linear-gradient(145deg, #334155, #1e293b);
            --cell-border: rgba(255, 255, 255, 0.1);
            --cell-text: #f1f5f9;
            --status-bg: rgba(30, 41, 59, 0.9);
            --status-text: #38bdf8;
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --arena-bg: #ffffff;
            --cell-bg: linear-gradient(145deg, #f1f5f9, #e2e8f0);
            --cell-border: rgba(0, 0, 0, 0.1);
            --cell-text: #1e293b;
            --status-bg: #ffffff;
            --status-text: #0284c7;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 10px 0 20px 0;
            flex-wrap: wrap;
        }

        h1 {
            color: var(--text-color);
            font-size: 34px;
            font-weight: 900;
            text-align: center;
            margin: 0;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .theme-toggle {
            background: #f59e0b;
            color: #fff;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            border: none;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 25px;
            max-width: 750px;
        }
        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        
        .btn-shuffle { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
        .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-clear { background: linear-gradient(135deg, #64748b, #475569); color: #fff; }
        .btn-reset { background: linear-gradient(135deg, #334155, #1e293b); color: #fff; border: 1px solid rgba(255,255,255,0.1); }

        button.active-tool {
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.9), 0 0 20px currentColor;
            transform: scale(1.08);
        }

        /* ساحة اللعب مع جدران سميكة بارزة */
        .arena {
            position: relative;
            padding: 25px;
            background: var(--arena-bg);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border-width: 18px;
            border-style: solid;
            border-color: #10b981 #ef4444 #10b981 #ef4444;
        }

        /* شبكة خلية النحل الهندسية الحقيقية (Hexagon Grid) */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 66px);
            gap: 6px;
            justify-content: center;
        }

        /* شكل الخلية السداسية الهندسية (Hexagon) */
        .cell {
            width: 72px;
            height: 64px;
            background: var(--cell-bg);
            border: var(--cell-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: var(--cell-text);
            cursor: pointer;
            user-select: none;
            position: relative;
            clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0% 50%);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        /* تأثير تداخل صفوف خلية النحل لتبدو هندسية متقاربة */
        .cell:nth-child(even) {
            transform: translateY(4px);
        }

        .cell:hover {
            background: #38bdf8 !important;
            color: #0f172a !important;
            transform: scale(1.12) translateY(0);
            z-index: 10;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        .cell.team-red {
            background: linear-gradient(135deg, #ef4444, #b91c1c) !important;
            color: white !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
        }
        .cell.team-green {
            background: linear-gradient(135deg, #10b981, #047857) !important;
            color: white !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
        }
        
        .status {
            margin-top: 25px;
            font-size: 16px;
            font-weight: 700;
            color: var(--status-text);
            background: var(--status-bg);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🎮 لعبة الحروف مع عبد الله</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 وضع ليلي / نهاري</button>
    </div>

    <div class="controls">
        <button class="btn-shuffle" onclick="shuffleLetters()">🔀 خلط الحروف</button>
        <button class="btn-red" id="tool-red" onclick="selectTool('red')">🟥 تلوين أحمر</button>
        <button class="btn-green" id="tool-green" onclick="selectTool('green')">🟩 تلوين أخضر</button>
        <button class="btn-clear" id="tool-clear" onclick="selectTool('clear')">🧹 مسح حرف</button>
        <button class="btn-reset" onclick="resetAll()">🔄 مسح الكل</button>
    </div>

    <div class="arena">
        <div class="board" id="gameBoard"></div>
    </div>
    
    <div class="status" id="gameStatus">اختر أداة من الأعلى للبدء في التحدي!</div>

    <script>
        const letters = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن'];
        let boardState = [];
        let currentTool = null;

        function initBoard() {
            boardState = letters.map(letter => ({ letter: letter, team: null }));
            renderBoard();
        }

        function shuffleLetters() {
            for (let i = boardState.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [boardState[i].letter, boardState[j].letter] = [boardState[j].letter, boardState[i].letter];
            }
            renderBoard();
            document.getElementById('gameStatus').innerText = "🔀 تم خلط الحروف داخل خلايا النحل الهندسية بنجاح!";
        }

        function selectTool(tool) {
            currentTool = tool;
            
            document.getElementById('tool-red').classList.remove('active-tool');
            document.getElementById('tool-green').classList.remove('active-tool');
            document.getElementById('tool-clear').classList.remove('active-tool');

            if (tool === 'red') {
                document.getElementById('tool-red').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🟥 الأداة مفعلة: انقر على أي خلية لتلوينها بالأحمر";
            } else if (tool === 'green') {
                document.getElementById('tool-green').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🟩 الأداة مفعلة: انقر على أي خلية لتلوينها بالأخضر";
            } else if (tool === 'clear') {
                document.getElementById('tool-clear').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🧹 الأداة مفعلة: انقر على أي خلية لمسح لونها";
            }
        }

        function renderBoard() {
            const boardEl = document.getElementById('gameBoard');
            boardEl.innerHTML = '';
            boardState.forEach((cell, index) => {
                const cellEl = document.createElement('div');
                cellEl.classList.add('cell');
                cellEl.innerText = cell.letter;
                
                if (cell.team === 'red') cellEl.classList.add('team-red');
                if (cell.team === 'green') cellEl.classList.add('team-green');

                cellEl.onclick = () => {
                    if (!currentTool) {
                        alert("⚠️ الرجاء اختيار أداة أولاً من الأعلى (تلوين أحمر، أخضر، أو مسح)!");
                        return;
                    }

                    if (currentTool === 'red') {
                        boardState[index].team = 'red';
                        document.getElementById('gameStatus').innerText = `🎯 تم تلوين الحرف [ ${cell.letter} ] لصالح الفريق الأحمر`;
                    } else if (currentTool === 'green') {
                        boardState[index].team = 'green';
                        document.getElementById('gameStatus').innerText = `🎯 تم تلوين الحرف [ ${cell.letter} ] لصالح الفريق الأخضر`;
                    } else if (currentTool === 'clear') {
                        boardState[index].team = null;
                        document.getElementById('gameStatus').innerText = `🧹 تم مسح لون الحرف [ ${cell.letter} ]`;
                    }
                    
                    renderBoard();
                };

                boardEl.appendChild(cellEl);
            });
        }

        function resetAll() {
            if (confirm("⚠️ هل أنت متأكد من مسح اللوحة بالكامل وإعادة ضبط اللعبة؟")) {
                boardState.forEach(cell => cell.team = null);
                currentTool = null;
                document.getElementById('tool-red').classList.remove('active-tool');
                document.getElementById('tool-green').classList.remove('active-tool');
                document.getElementById('tool-clear').classList.remove('active-tool');
                renderBoard();
                document.getElementById('gameStatus').innerText = "🔄 تم إعادة ضبط اللوحة بنجاح.";
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('gameStatus').innerText = isLight ? "☀️ تم تفعيل الوضع النهاري (المشرق)" : "🌙 تم تفعيل الوضع الليلي (الداكن)";
        }

        initBoard();
    </script>
</body>
</html>
