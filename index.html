<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحروف مع عبد الله</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* الوضع النهاري الساطع (مثالي للبروجكتر والإضاءة) */
            --bg-main: radial-gradient(circle at 50% 30%, #ffffff 0%, #f1f5f9 55%, #cbd5e1 100%);
            --text-primary: #0f172a;
            --dock-bg: rgba(255, 255, 255, 0.9);
            --dock-border: rgba(203, 213, 225, 0.9);
            --arena-bg: radial-gradient(circle at center, #ffffff 0%, #f8fafc 70%, #e2e8f0 100%);
            --arena-inner-shadow: inset 0 0 35px rgba(15, 23, 42, 0.08);
            
            /* الخلية السداسية ثلاثية الأبعاد */
            --hex-outer: linear-gradient(145deg, #cbd5e1, #94a3b8);
            --hex-inner: linear-gradient(165deg, #ffffff 0%, #f8fafc 55%, #e2e8f0 100%);
            --hex-text: #0f172a;
            --hex-shadow: drop-shadow(0 10px 14px rgba(15, 23, 42, 0.16));

            /* ألوان الفريق الأحمر (ياقوتي مشع) */
            --red-outer: linear-gradient(145deg, #fecaca, #ef4444);
            --red-inner: linear-gradient(160deg, #ff6b6b 0%, #ef4444 45%, #991b1b 100%);
            --red-glow: drop-shadow(0 12px 24px rgba(239, 68, 68, 0.65));

            /* ألوان الفريق الأخضر (زمردي مشع) */
            --green-outer: linear-gradient(145deg, #a7f3d0, #10b981);
            --green-inner: linear-gradient(160deg, #34d399 0%, #10b981 45%, #065f46 100%);
            --green-glow: drop-shadow(0 12px 24px rgba(16, 185, 129, 0.65));
        }

        body.dark-mode {
            /* الوضع الليلي الفخم */
            --bg-main: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 65%, #020617 100%);
            --text-primary: #f8fafc;
            --dock-bg: rgba(30, 41, 59, 0.85);
            --dock-border: rgba(255, 255, 255, 0.12);
            --arena-bg: radial-gradient(circle at center, #1e293b 0%, #0f172a 85%);
            --arena-inner-shadow: inset 0 0 45px rgba(0, 0, 0, 0.6);

            --hex-outer: linear-gradient(145deg, #64748b, #334155);
            --hex-inner: linear-gradient(165deg, #334155 0%, #1e293b 60%, #0f172a 100%);
            --hex-text: #f8fafc;
            --hex-shadow: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.55));
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.4s ease;
        }

        /* الشريط العلوي المدمج (يوفر مساحة أكبر للخلية في البروجكتر) */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1180px;
            padding: 10px 24px;
            background: var(--dock-bg);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            border: 1px solid var(--dock-border);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.12);
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 34px;
            filter: drop-shadow(0 4px 8px rgba(245, 158, 11, 0.4));
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #0284c7, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.dark-mode h1 {
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* أدوات التحكم الرئيسية في وسط الشريط */
        .tools-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .tool-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            position: relative;
        }

        .tool-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
            border-radius: 14px 14px 0 0;
            pointer-events: none;
        }

        .tool-btn:hover {
            transform: translateY(-3px) scale(1.04);
        }

        .btn-shuffle { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 6px 15px rgba(245, 158, 11, 0.35); }
        .btn-red { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 6px 15px rgba(239, 68, 68, 0.35); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.35); }
        .btn-clear { background: linear-gradient(135deg, #64748b, #334155); box-shadow: 0 6px 15px rgba(100, 116, 139, 0.35); }
        .btn-reset { background: linear-gradient(135deg, #334155, #0f172a); box-shadow: 0 6px 15px rgba(15, 23, 42, 0.35); }

        .tool-btn.active-tool {
            transform: translateY(-3px) scale(1.08);
            outline: 3px solid var(--text-primary);
            outline-offset: 3px;
        }

        /* أزرار النظام والمؤقت */
        .system-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .sys-btn {
            background: var(--arena-bg);
            color: var(--text-primary);
            border: 1px solid var(--dock-border);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .sys-btn:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
        }

        .timer-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            min-width: 95px;
            justify-content: center;
        }

        .timer-btn.running {
            background: linear-gradient(135deg, #ec4899, #be185d);
            animation: pulseTimer 1s infinite;
        }

        @keyframes pulseTimer {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* ====================================================
           المربع العملاق والخلية المتوازنة هندسياً 100%
           ==================================================== */
        .stage-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 10px 0;
        }

        /* الإطار الخارجي الملون (أخضر فوق وتحت، أحمر يمين ويسار) بدون أي نصوص */
        .arena-frame {
            position: relative;
            padding: 28px; /* سماكة الجدار الملون */
            border-radius: 48px;
            background: conic-gradient(
                from 45deg,
                #ef4444 0deg 90deg,
                #10b981 90deg 180deg,
                #ef4444 180deg 270deg,
                #10b981 270deg 360deg
            );
            box-shadow: 
                0 30px 70px -15px rgba(0, 0, 0, 0.35),
                0 0 35px rgba(16, 185, 129, 0.2),
                0 0 35px rgba(239, 68, 68, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* خط إضاءة داخلي يفصل الجدار عن الساحة */
        .arena-board {
            background: var(--arena-bg);
            box-shadow: var(--arena-inner-shadow);
            border-radius: 30px;
            /* مساحات متساوية ودقيقة جداً من جميع الجهات لتوسيط الخلية 100% */
            padding: 36px 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        /* شبكة خلية النحل العملاقة */
        .honeycomb {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hex-row {
            display: flex;
            gap: 10px;
            margin-top: -27px; /* التعشيق العمودي الدقيق للخلايا السداسية */
        }

        .hex-row:first-child {
            margin-top: 0;
        }

        /* 
           سر التوسيط الهندسي المتماثل (Symmetrical Honeycomb Offset):
           الخلية عرضها 108px + الفراغ 10px = 118px.
           ربع المسافة يميناً للصفوف الفردية (+29.5px) وربع المسافة يساراً للصفوف الزوجية (-29.5px).
           هكذا تتعشق الخلايا 100% وتبقى اللوحة في المنتصف تماماً بدون أي ميلان!
        */
        .hex-row.odd-row {
            transform: translateX(29.5px);
        }

        .hex-row.even-row {
            transform: translateX(-29.5px);
        }

        /* حجم الخلية العملاق للبروجكتر */
        .hex-wrapper {
            width: 108px;
            height: 124px;
            position: relative;
            cursor: pointer;
            filter: var(--hex-shadow);
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
            z-index: 1;
        }

        .hex-outer {
            width: 100%;
            height: 100%;
            background: var(--hex-outer);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hex-inner {
            width: 100%;
            height: 100%;
            background: var(--hex-inner);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* تاج الإضاءة الكريستالي أعلى كل خلية */
        .hex-inner::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 14%;
            right: 14%;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0));
            clip-path: polygon(50% 0%, 100% 45%, 82% 100%, 18% 100%, 0% 45%);
            pointer-events: none;
        }

        body.dark-mode .hex-inner::before {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
        }

        /* الحرف العملاق الواضح للجمهور */
        .hex-letter {
            font-family: 'Tajawal', sans-serif;
            font-size: 44px;
            font-weight: 900;
            color: var(--hex-text);
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
            z-index: 2;
            line-height: 1;
        }

        /* تفاعل الخلية عند التمرير */
        .hex-wrapper:hover {
            transform: scale(1.14) translateY(-5px);
            z-index: 30;
            filter: drop-shadow(0 18px 25px rgba(59, 130, 246, 0.45));
        }

        .hex-wrapper:hover .hex-outer {
            background: linear-gradient(145deg, #38bdf8, #2563eb);
        }

        /* تلوين الفريق الأحمر */
        .hex-wrapper.team-red {
            filter: var(--red-glow);
            z-index: 10;
        }
        .hex-wrapper.team-red .hex-outer {
            background: var(--red-outer);
        }
        .hex-wrapper.team-red .hex-inner {
            background: var(--red-inner);
        }
        .hex-wrapper.team-red .hex-letter {
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(127, 29, 29, 0.85);
            transform: scale(1.08);
        }

        /* تلوين الفريق الأخضر */
        .hex-wrapper.team-green {
            filter: var(--green-glow);
            z-index: 10;
        }
        .hex-wrapper.team-green .hex-outer {
            background: var(--green-outer);
        }
        .hex-wrapper.team-green .hex-inner {
            background: var(--green-inner);
        }
        .hex-wrapper.team-green .hex-letter {
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(6, 78, 59, 0.85);
            transform: scale(1.08);
        }

        @keyframes popHex {
            0% { transform: scale(0.7) rotateY(90deg); }
            65% { transform: scale(1.18) rotateY(-8deg); }
            100% { transform: scale(1) rotateY(0deg); }
        }
        .animate-pop {
            animation: popHex 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* شريط الحالة السفلي الأنيق */
        .status-bar {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            background: var(--dock-bg);
            backdrop-filter: blur(12px);
            padding: 10px 32px;
            border-radius: 30px;
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.12);
            border: 1px solid var(--dock-border);
        }

        /* التجاوب مع الشاشات المتوسطة والجوال */
        @media (max-width: 900px) {
            .top-bar { justify-content: center; text-align: center; }
            .arena-board { padding: 28px 48px; }
            .hex-wrapper { width: 84px; height: 96px; }
            .hex-row { gap: 8px; margin-top: -21px; }
            .hex-row.odd-row { transform: translateX(23px); }
            .hex-row.even-row { transform: translateX(-23px); }
            .hex-letter { font-size: 34px; }
        }

        @media (max-width: 550px) {
            .arena-frame { padding: 16px; border-radius: 32px; }
            .arena-board { padding: 20px 28px; border-radius: 20px; }
            .hex-wrapper { width: 58px; height: 66px; }
            .hex-row { gap: 5px; margin-top: -14px; }
            .hex-row.odd-row { transform: translateX(15.75px); }
            .hex-row.even-row { transform: translateX(-15.75px); }
            .hex-letter { font-size: 23px; }
            .tool-btn { padding: 8px 14px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي الشامل: الهوية + أدوات التلوين + أدوات العرض -->
    <div class="top-bar">
        <div class="brand">
            <span class="brand-icon">🐝</span>
            <h1>لعبة الحروف مع عبد الله</h1>
        </div>

        <div class="tools-group">
            <button class="tool-btn btn-shuffle" onclick="shuffleLetters()">🔀 خلط</button>
            <button class="tool-btn btn-red" id="tool-red" onclick="selectTool('red')">🟥 أحمر</button>
            <button class="tool-btn btn-green" id="tool-green" onclick="selectTool('green')">🟩 أخضر</button>
            <button class="tool-btn btn-clear" id="tool-clear" onclick="selectTool('clear')">🧹 مسح حرف</button>
            <button class="tool-btn btn-reset" onclick="resetAll()">🔄 مسح الكل</button>
        </div>

        <div class="system-group">
            <button class="sys-btn timer-btn" id="timerBtn" onclick="toggleTimer()">⏱️ 15 ث</button>
            <button class="sys-btn" id="fullscreenBtn" onclick="toggleFullScreen()" title="ملء الشاشة للبروجكتر">📺 عرض كامل</button>
            <button class="sys-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
            <button class="sys-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <!-- ساحة خلية النحل العملاقة المتوازنة 100% في المنتصف -->
    <div class="stage-container">
        <div class="arena-frame">
            <div class="arena-board">
                <div class="honeycomb" id="gameBoard"></div>
            </div>
        </div>
    </div>

    <!-- شريط الحالة السفلي -->
    <div class="status-bar" id="gameStatus">
        ✨ جاهز للتحدي! اختر اللون ثم اضغط على الحرف مباشرة
    </div>

    <script>
        const letters = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن'];
        let boardState = [];
        let currentTool = 'red';
        let soundEnabled = true;
        let lastClickedIndex = null;

        // مؤقت المسابقة
        let timerInterval = null;
        let timeLeft = 15;

        // محرك الصوتيات التفاعلي
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playTone(freq, type = 'sine', duration = 0.14) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function initBoard() {
            boardState = letters.map(letter => ({ letter: letter, team: null }));
            selectTool('red');
            renderBoard();
        }

        function shuffleLetters() {
            playTone(300, 'triangle', 0.12);
            setTimeout(() => playTone(450, 'triangle', 0.14), 70);
            setTimeout(() => playTone(600, 'triangle', 0.16), 140);

            for (let i = boardState.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [boardState[i].letter, boardState[j].letter] = [boardState[j].letter, boardState[i].letter];
            }
            lastClickedIndex = null;
            renderBoard();
            document.getElementById('gameStatus').innerText = "🔀 تم خلط الحروف وتوزيعها عشوائياً!";
        }

        function selectTool(tool) {
            currentTool = tool;
            playTone(420, 'sine', 0.08);
            
            document.getElementById('tool-red').classList.remove('active-tool');
            document.getElementById('tool-green').classList.remove('active-tool');
            document.getElementById('tool-clear').classList.remove('active-tool');

            if (tool === 'red') {
                document.getElementById('tool-red').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🟥 أداة التلوين الأحمر نشطة — اضغط على أي حرف";
            } else if (tool === 'green') {
                document.getElementById('tool-green').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🟩 أداة التلوين الأخضر نشطة — اضغط على أي حرف";
            } else if (tool === 'clear') {
                document.getElementById('tool-clear').classList.add('active-tool');
                document.getElementById('gameStatus').innerText = "🧹 الممحاة نشطة — اضغط على أي حرف لمسح لونه";
            }
        }

        function renderBoard() {
            const boardEl = document.getElementById('gameBoard');
            boardEl.innerHTML = '';

            for (let row = 0; row < 5; row++) {
                const rowEl = document.createElement('div');
                rowEl.classList.add('hex-row');
                // توازن متماثل: الصفوف الفردية يميناً قليلاً والزوجية يساراً قليلاً لتكون الخلية في قلب المركز 100%
                if (row % 2 === 0) {
                    rowEl.classList.add('odd-row');
                } else {
                    rowEl.classList.add('even-row');
                }

                for (let col = 0; col < 5; col++) {
                    const index = row * 5 + col;
                    const cell = boardState[index];

                    const wrapper = document.createElement('div');
                    wrapper.classList.add('hex-wrapper');
                    if (cell.team === 'red') wrapper.classList.add('team-red');
                    if (cell.team === 'green') wrapper.classList.add('team-green');
                    if (index === lastClickedIndex) wrapper.classList.add('animate-pop');

                    wrapper.innerHTML = `
                        <div class="hex-outer">
                            <div class="hex-inner">
                                <span class="hex-letter">${cell.letter}</span>
                            </div>
                        </div>
                    `;

                    wrapper.onclick = () => handleCellClick(index);
                    rowEl.appendChild(wrapper);
                }

                boardEl.appendChild(rowEl);
            }
        }

        function handleCellClick(index) {
            lastClickedIndex = index;
            const letter = boardState[index].letter;

            if (currentTool === 'red') {
                boardState[index].team = 'red';
                playTone(540, 'sine', 0.16);
                setTimeout(() => playTone(720, 'sine', 0.18), 60);
                document.getElementById('gameStatus').innerText = `🟥 الفريق الأحمر يسيطر على حرف [ ${letter} ]!`;
            } else if (currentTool === 'green') {
                boardState[index].team = 'green';
                playTone(580, 'sine', 0.16);
                setTimeout(() => playTone(820, 'sine', 0.18), 60);
                document.getElementById('gameStatus').innerText = `🟩 الفريق الأخضر يسيطر على حرف [ ${letter} ]!`;
            } else if (currentTool === 'clear') {
                boardState[index].team = null;
                playTone(250, 'sine', 0.14);
                document.getElementById('gameStatus').innerText = `🧹 تم إرجاع حرف [ ${letter} ] للوضع المحايد`;
            }

            renderBoard();
        }

        function resetAll() {
            if (confirm("⚠️ هل أنت متأكد من مسح جميع الحروف الملونة وبدء جولة جديدة؟")) {
                playTone(200, 'sawtooth', 0.22);
                boardState.forEach(cell => cell.team = null);
                lastClickedIndex = null;
                renderBoard();
                document.getElementById('gameStatus').innerText = "🔄 تم تصفير اللوحة بالكامل.. جولة جديدة!";
            }
        }

        // مؤقت 15 ثانية للإثارة والحماس
        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                timeLeft = 15;
                btn.innerText = "⏱️ 15 ث";
                btn.classList.remove('running');
                document.getElementById('gameStatus').innerText = "⏹️ تم إيقاف المؤقت.";
                return;
            }

            timeLeft = 15;
            btn.classList.add('running');
            btn.innerText = `⏱️ ${timeLeft} ث`;
            playTone(600, 'sine', 0.1);
            document.getElementById('gameStatus').innerText = "⏳ بدأ العد التنازلي للإجابة (15 ثانية)!";

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    btn.innerText = `⏱️ ${timeLeft} ث`;
                    if (timeLeft <= 5) playTone(750, 'square', 0.08); // تنبيه الثواني الأخيرة
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    btn.innerText = "⏱️ 15 ث";
                    btn.classList.remove('running');
                    playTone(180, 'sawtooth', 0.5); // صافرة انتهاء الوقت
                    document.getElementById('gameStatus').innerText = "⏰ انتهى الوقت! الفرصة تنتقل للفريق الآخر!";
                }
            }, 1000);
        }

        // وضع ملء الشاشة للبروجكتر
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtn').innerText = isDark ? "☀️" : "🌙";
            playTone(440, 'sine', 0.1);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? "🔊" : "🔇";
        }

        initBoard();
    </script>
</body>
</html>
